name: Deploy Studio to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an older one rather than stack up.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Assemble the site
        # The Studio at /studio/, plus the card demo and the example pack so
        # the live demo works from the same origin.
        run: |
          mkdir -p site
          cp -r dist/studio site/studio
          mkdir -p site/dist
          cp dist/domoview.js site/dist/
          cp -r examples site/examples
          cp examples/demo.html site/index.html
          rm -f site/studio/*.map
          # The demo page loads the bundle with a relative path; rewrite it for
          # the flattened layout at the site root.
          sed -i "s|'../dist/domoview.js'|'./dist/domoview.js'|" site/index.html
          sed -i "s|'../examples/demo-apartment'|'./examples/demo-apartment'|" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
