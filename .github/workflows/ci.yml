name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate example packs
        run: |
          shopt -s nullglob
          packs=(examples/*/home.json)
          if [ ${#packs[@]} -eq 0 ]; then
            echo "no example packs found" >&2
            exit 1
          fi
          node tools/pack/validate.mjs "${packs[@]}"

      - name: Demo pack is reproducible from its project file
        # The generator runs the Studio's own exporter, so this also checks the
        # authoring pipeline still works.
        #
        # The manifest is compared byte for byte: it is decimal-rounded JSON.
        # The model is compared structurally, because byte-identical float
        # geometry is not something this pipeline can promise across
        # toolchains — Math.sin and friends are not specified to be
        # bit-identical between V8 versions, and those last bits end up in
        # float32 vertices.
        run: |
          node tools/pack/make-demo-pack.mjs "$RUNNER_TEMP/regen"
          diff -u examples/demo-apartment/home.json "$RUNNER_TEMP/regen/home.json" \
            || { echo "::error::home.json changed after regenerating. Run 'npm run demo' and commit the result."; exit 1; }
          diff -u examples/demo-apartment/project.domoview.json "$RUNNER_TEMP/regen/project.domoview.json" \
            || { echo "::error::project.domoview.json changed after regenerating."; exit 1; }
          node tools/pack/compare-glb.mjs \
            examples/demo-apartment/model.glb "$RUNNER_TEMP/regen/model.glb" \
            || { echo "::error::the regenerated model is not equivalent to the committed one."; exit 1; }

      - name: dist/ matches the sources
        # HACS installs dist/domoview.js straight from the repository, so a
        # stale bundle ships broken code to users.
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi

      - name: Report bundle size
        run: |
          node -e "
            const { gzipSync } = require('zlib');
            const { readFileSync, statSync } = require('fs');
            for (const file of ['dist/domoview.js', 'dist/studio/studio.js']) {
              const bytes = readFileSync(file);
              console.log(
                file.padEnd(26),
                (statSync(file).size / 1024).toFixed(1).padStart(8) + ' kB raw',
                (gzipSync(bytes).length / 1024).toFixed(1).padStart(8) + ' kB gzip',
              );
            }
          " >> "$GITHUB_STEP_SUMMARY"

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
