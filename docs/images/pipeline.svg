<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="DomoView pipeline: a floor plan and room photos become a Home Pack in the Studio, which the card renders either live in WebGL or from baked images.">
  <title>DomoView pipeline</title>
  <desc>A floor plan image and room photos go into DomoView Studio, which produces a Home Pack containing model.glb and home.json. The DomoView card renders that pack with either the live 3D renderer or the baked renderer, driven by Home Assistant entity states.</desc>

  <rect x="0" y="0" width="900" height="300" rx="14" fill="#16232a"/>

  <!-- inputs -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="28" y="52" width="150" height="70" rx="10" fill="#1e2f39" stroke="#33505d" stroke-width="1.5"/>
    <text x="103" y="82" fill="#e7f0ee" font-size="15" font-weight="600" text-anchor="middle">Floor plan</text>
    <text x="103" y="102" fill="#8fa8a3" font-size="12" text-anchor="middle">PNG / JPG</text>

    <rect x="28" y="140" width="150" height="70" rx="10" fill="#1e2f39" stroke="#33505d" stroke-width="1.5"/>
    <text x="103" y="170" fill="#e7f0ee" font-size="15" font-weight="600" text-anchor="middle">Room photos</text>
    <text x="103" y="190" fill="#8fa8a3" font-size="12" text-anchor="middle">heights, colours</text>

    <!-- studio -->
    <rect x="248" y="76" width="168" height="110" rx="12" fill="#1d3b38" stroke="#4ecfae" stroke-width="2"/>
    <text x="332" y="112" fill="#eafaf4" font-size="16" font-weight="700" text-anchor="middle">Studio</text>
    <text x="332" y="134" fill="#9fd9c8" font-size="12" text-anchor="middle">trace &#183; calibrate</text>
    <text x="332" y="152" fill="#9fd9c8" font-size="12" text-anchor="middle">place &#183; preview</text>
    <text x="332" y="170" fill="#6fa99b" font-size="11" text-anchor="middle">in your browser</text>

    <!-- home pack -->
    <rect x="486" y="60" width="168" height="142" rx="12" fill="#1e2f39" stroke="#7fc4ff" stroke-width="2"/>
    <text x="570" y="90" fill="#e7f0ee" font-size="16" font-weight="700" text-anchor="middle">Home Pack</text>
    <text x="570" y="118" fill="#bcd9ef" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">model.glb</text>
    <text x="570" y="138" fill="#bcd9ef" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">home.json</text>
    <text x="570" y="158" fill="#7a97ad" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">baked/ (opt.)</text>
    <text x="570" y="182" fill="#6f8fa6" font-size="11" text-anchor="middle">shareable &#183; no entity ids</text>

    <!-- renderers -->
    <rect x="724" y="52" width="150" height="62" rx="10" fill="#1e2f39" stroke="#f4c676" stroke-width="1.5"/>
    <text x="799" y="78" fill="#e7f0ee" font-size="14.5" font-weight="600" text-anchor="middle">Live 3D</text>
    <text x="799" y="97" fill="#c8ab7c" font-size="11.5" text-anchor="middle">three.js &#183; WebGL</text>

    <rect x="724" y="128" width="150" height="62" rx="10" fill="#1e2f39" stroke="#f4c676" stroke-width="1.5"/>
    <text x="799" y="154" fill="#e7f0ee" font-size="14.5" font-weight="600" text-anchor="middle">Baked</text>
    <text x="799" y="173" fill="#c8ab7c" font-size="11.5" text-anchor="middle">composited images</text>

    <!-- home assistant feed -->
    <rect x="486" y="228" width="388" height="48" rx="10" fill="#151f26" stroke="#2d4450" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="680" y="248" fill="#9db3ae" font-size="12.5" text-anchor="middle">Home Assistant states drive the scene</text>
    <text x="680" y="266" fill="#6f8580" font-size="11" text-anchor="middle">lights &#183; covers &#183; sun &#183; weather &#183; climate</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7a86"/>
    </marker>
    <marker id="arrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a98a56"/>
    </marker>
  </defs>
  <g stroke="#5b7a86" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 178 87 L 214 87 Q 232 87 232 105 L 232 122 L 244 122"/>
    <path d="M 178 175 L 214 175 Q 232 175 232 157 L 232 140 L 244 140"/>
    <path d="M 416 131 L 482 131"/>
  </g>
  <g stroke="#a98a56" stroke-width="2" fill="none" marker-end="url(#arrowWarm)">
    <path d="M 654 110 Q 692 110 692 83 L 720 83"/>
    <path d="M 654 152 Q 692 152 692 159 L 720 159"/>
  </g>
  <path d="M 799 228 L 799 196" stroke="#2d4450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
